name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - name: Package release (fails if secrets would ship)
        run: node ../scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/optionbuilder/
          # .htaccess is a dotfile — without this it would be silently dropped.
          include-hidden-files: true
          retention-days: 7

  backend:
    name: Backend (PHP syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner image ships with PHP, so no third-party setup action is
      # needed (and none has to be allowed in the repo's Actions settings).
      # Syntax checks on a newer PHP still catch errors in code targeting 8.1+.
      - run: php -v
      - name: Lint every PHP file
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

  # Uploads the release to the web host after every green push to main.
  # Configure in GitHub → Settings → Secrets and variables → Actions:
  #   secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD
  #   variables: DEPLOY_PROTOCOL  (ftps | sftp | ftp, default ftps)
  #              DEPLOY_DIR       (default /, the FTP account's folder)
  # Until DEPLOY_HOST is set this job just reports that it skipped.
  deploy:
    name: Deploy to adddots.com
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      SITE_URL: ${{ vars.DEPLOY_SITE_URL || 'https://www.optionbuilder.adddots.com' }}
      PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'ftps' }}
      # The deploy FTP account's folder is the app folder itself
      # (public_html/app/Optionbuilder/, the subdomain's folder), so the default
      # uploads to its top.
      # A path with a leading / starts from the account's top folder; one
      # without starts from the folder the account logs in to.
      REMOTE_DIR: ${{ vars.DEPLOY_DIR || '/' }}
    steps:
      - name: Check deploy settings
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::notice::Deploy skipped — DEPLOY_HOST / DEPLOY_USER / DEPLOY_PASSWORD secrets are not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: release
          path: release

      # SFTP and plain FTP use lftp; FTPS (the default) uses curl, below.
      - name: Install lftp
        if: steps.check.outputs.ready == 'true' && env.PROTOCOL != 'ftps' && env.PROTOCOL != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Upload only — nothing on the server is deleted, so the live config,
      # broker token and cache in api/data/ are never touched. index.html goes
      # last, so visitors only switch to the new build once its assets/ are there.
      #
      # FTPS: Hostinger's FTP certificate is issued to *.hstgr.io, a name no
      # address for this site can match, so the usual hostname check cannot
      # pass. Instead the server's public key is pinned: curl checks the pin
      # inside the same encrypted connection that sends the password, so no
      # other server can stand in for it. If Hostinger ever changes the key,
      # this step stops and prints the new pin for the DEPLOY_FTPS_PIN variable.
      - name: Upload
        if: steps.check.outputs.ready == 'true'
        env:
          FTPS_PIN: ${{ vars.DEPLOY_FTPS_PIN || 'sha256//iD1qTPTlmilSMjmnGtuhIjGlRZY9GF4YIhDr8P0WXNw=' }}
        run: |
          set -euo pipefail
          if [ "$PROTOCOL" != "ftps" ] && [ -n "$PROTOCOL" ]; then
            case "$PROTOCOL" in
              sftp) URL="sftp://$DEPLOY_HOST"; OPTS="set sftp:auto-confirm yes;" ;;
              *)    URL="ftp://$DEPLOY_HOST";  OPTS="set ftp:ssl-allow no;" ;;
            esac
            lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$URL" -e "
              $OPTS
              set net:max-retries 2; set net:timeout 30;
              mkdir -p -f $REMOTE_DIR;
              mirror --reverse --verbose --parallel=4 --exclude-glob index.html release/ $REMOTE_DIR/;
              put -O $REMOTE_DIR release/index.html;
              bye"
            exit 0
          fi

          # The login goes in a curl config file (not on the command line, where
          # other processes could read it).
          cfg="$RUNNER_TEMP/ftp.cfg"
          umask 077
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
          printf 'user = "%s:%s"\n' "$(esc "$DEPLOY_USER")" "$(esc "$DEPLOY_PASSWORD")" > "$cfg"

          dir="${REMOTE_DIR#./}"; dir="${dir%/}"; [ "$dir" = "." ] && dir=""
          # In an ftp:// URL, %2F marks a path from the account's top folder;
          # otherwise curl starts from the login folder.
          case "$dir" in
            /*) base="ftp://$DEPLOY_HOST/%2F${dir#/}/" ;;
            *)  base="ftp://$DEPLOY_HOST/${dir:+$dir/}" ;;
          esac

          put() {
            local code=0
            curl --silent --show-error --fail --ssl-reqd --insecure --pinnedpubkey "$FTPS_PIN" \
              --ftp-create-dirs --retry 2 --connect-timeout 30 -K "$cfg" -T "$1" "$base$1" || code=$?
            if [ "$code" = 90 ]; then
              now=$(echo | timeout 20 openssl s_client -starttls ftp -connect "$DEPLOY_HOST:21" 2>/dev/null \
                | openssl x509 -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64)
              echo "::error::The FTP server's key no longer matches the pinned one, so nothing was sent. If Hostinger renewed its certificate, check the new key is theirs (hPanel / support), then set the repository variable DEPLOY_FTPS_PIN to: sha256//$now"
            fi
            return $code
          }

          cd release
          n=0
          while IFS= read -r f; do
            f="${f#./}"
            put "$f"
            n=$((n + 1))
          done < <(find . -type f ! -path ./index.html | sort)
          put index.html
          echo "Uploaded $((n + 1)) files over FTPS (pinned key) to ${dir:-the FTP account home folder}."
          rm -f "$cfg"

      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/health")
          echo "api/health → $code"
          [ "$code" = "200" ]
