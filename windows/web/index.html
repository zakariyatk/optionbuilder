<!doctype html>
<!-- The app's start page: opens the live site as soon as it answers, and says so while it doesn't. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AddStock</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #050505;
        --text: #f2f2f2;
        --muted: #8e8e96;
        --accent: #7b61ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f9f9f7;
          --text: #111;
          --muted: #6b6b70;
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 'Segoe UI', system-ui, sans-serif;
      }
      main {
        text-align: center;
        max-width: 22rem;
        padding: 16px;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 14px 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0;
      }
      button {
        margin-top: 18px;
        height: 38px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <h1 id="title">Opening AddStock…</h1>
      <p id="detail" hidden>Can't reach the AddStock server. Check your internet connection; the app tries again every few seconds.</p>
      <button id="retry" type="button" hidden>Try again</button>
    </main>
    <script>
      const SITE = 'https://optionbuilder.adddots.com/';
      const RETRY_MS = 5000;
      let timer;

      async function open() {
        clearTimeout(timer);
        try {
          // An opaque no-cors request only fails when the server can't be reached at all.
          await fetch(SITE + 'api/health', { mode: 'no-cors', cache: 'no-store' });
          location.replace(SITE);
        } catch {
          document.getElementById('title').textContent = "You're offline";
          document.getElementById('detail').hidden = false;
          document.getElementById('retry').hidden = false;
          timer = setTimeout(open, RETRY_MS);
        }
      }

      document.getElementById('retry').addEventListener('click', open);
      window.addEventListener('online', open);
      open();
    </script>
  </body>
</html>
